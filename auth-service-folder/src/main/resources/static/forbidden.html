<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymFlow — Không đủ quyền</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .forbidden { min-height: 100vh; padding: 24px; display: grid; place-items: center; text-align: center; }
    .forbidden-card { max-width: 440px; padding: 40px; border: 1px solid #343a31; border-radius: 14px; background: #191d17; }
    .forbidden-code { color: var(--accent); font: 800 58px "Manrope", sans-serif; }
    .forbidden h1 { margin: 7px 0; font: 700 22px "Manrope", sans-serif; }
    .forbidden p { color: #a0a69a; font-size: 12px; line-height: 1.7; }
    .forbidden a { margin-top: 17px; display: inline-flex; padding: 11px 16px; border-radius: 7px; background: var(--accent); color: #18200f; text-decoration: none; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body><main class="forbidden"><section class="forbidden-card"><div class="forbidden-code">403</div><h1>Bạn chưa có quyền truy cập</h1><p>Tài khoản hiện tại không được phép mở khu vực này. Hãy quay về trang phù hợp với vai trò của bạn.</p><a href="/">Về trang tài khoản</a></section></main></body>
</html>
