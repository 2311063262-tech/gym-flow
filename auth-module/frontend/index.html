<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Gym Management</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2332 0%, #2d3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }
        
        .login-left {
            padding: 50px 40px;
            flex: 1;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #1a2332;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        
        .logo-main {
            font-size: 20px;
            font-weight: 700;
            color: #b8ff3c;
        }
        
        .logo-sub {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .welcome-text {
            color: #999;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .main-title {
            font-size: 32px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .main-title .highlight {
            color: #b8ff3c;
        }
        
        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        
        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            background: #ebebeb;
            box-shadow: none;
            outline: none;
        }
        
        .form-control::placeholder {
            color: #aaa;
        }
        
        .btn-login {
            background: #b8ff3c;
            color: #1a2332;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            margin-top: 25px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover {
            background: #a3e635;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(184, 255, 60, 0.3);
        }
        
        .login-right {
            background: linear-gradient(135deg, #2d4a5c 0%, #1a2e3d 100%);
            flex: 0.7;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }
        
        .right-icon {
            width: 80px;
            height: 80px;
            background: rgba(184, 255, 60, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        .right-icon svg {
            width: 45px;
            height: 45px;
            fill: #b8ff3c;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .quote {
            text-align: center;
            max-width: 280px;
        }
        
        .quote-small {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .quote-big {
            font-size: 20px;
            font-weight: 600;
            color: #b8ff3c;
            line-height: 1.4;
        }
        
        .stats {
            position: absolute;
            bottom: 40px;
            text-align: center;
        }
        
        .stats-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .stats-number {
            font-size: 48px;
            font-weight: 700;
            color: white;
        }
        
        .stats-unit {
            font-size: 14px;
            color: #b8ff3c;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .login-right {
                display: none;
            }
            
            .login-left {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <!-- Left Side - Login Form -->
            <div class="login-left">
                <div class="logo-container">
                    <div class="logo-icon">G</div>
                    <div class="logo-text">
                        <div class="logo-main">Fitez</div>
                        <div class="logo-sub">FITNESS OPERATIONS</div>
                    </div>
                </div>
                
                <div class="welcome-text">WELCOME BACK</div>
                <h1 class="main-title">
                    Vận hành khỏe hơn,<br>
                    <span class="highlight">mỗi ngày.</span>
                </h1>
                <p class="subtitle">
                    Đăng nhập hệ thống để theo dõi phòng gym, lớp học, PT và các thành viên thực tập của bạn vào bất cứ lúc nào.
                </p>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            placeholder="user@gymhome.vn"
                            required
                        >
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            placeholder="••••••••"
                            required
                        >
                    </div>
                    
                    <div id="errorMessage" class="error-message"></div>
                    
                    <button type="submit" class="btn-login">
                        <span>Đăng nhập</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>
            </div>
            
            <!-- Right Side - Quote & Stats -->
            <div class="login-right">
                <div class="right-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                
                <div class="quote">
                    <div class="quote-small">"Small steps.</div>
                    <div class="quote-big">Big momentum."</div>
                </div>
                
                <div class="stats">
                    <div class="stats-label">JOINING GYMS</div>
                    <div class="stats-number">7<span class="stats-unit">+15%</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common JS -->
    <script src="js/common.js"></script>
    <!-- Login JS -->
    <script src="js/login.js"></script>
</body>
</html>
