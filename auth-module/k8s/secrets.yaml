---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gym-auth

---
# MySQL Secret
# Note: Base64 encode your actual values before applying
# Example: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: gym-auth
type: Opaque
data:
  root-password: cm9vdHBhc3N3b3Jk  # rootpassword
  username: Z3ltdXNlcg==  # gymuser
  password: Z3ltcGFzc3dvcmQ=  # gympassword

---
# JWT Secret
# Generate secure random key: openssl rand -base64 32 | base64
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gym-auth
type: Opaque
data:
  secret: TXlTZWNyZXRLZXlGb3JKV1RUb2tlbkF1dGhlbnRpY2F0aW9uU3lzdGVtR3ltTWFuYWdlbWVudDIwMjY=
  # MySecretKeyForJWTTokenAuthenticationSystemGymManagement2026
